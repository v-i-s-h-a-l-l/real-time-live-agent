# Render Blueprint — Lumina voice backend
# https://render.com/docs/blueprint-spec
#
# Production LLM is OpenAI (LLM_PROVIDER=openai). GROQ/GEMINI/OPENROUTER
# keys are optional fallbacks only if you change LLM_PROVIDER.
# Do not set CEREBRAS_*. Env table must match railway.toml comments.
#
# Default: native Python (existing). To deploy the Docker image instead:
#   runtime: docker
#   dockerfilePath: ./server/Dockerfile
#   dockerContext: .
# and remove buildCommand / startCommand (the image ENTRYPOINT binds 0.0.0.0:$PORT).
#
# IMPORTANT: Root Directory must be EMPTY (repo root already is this project).
# Secrets (API keys, SESSION_SECRET) stay sync: false — never commit values.
services:
  - type: web
    name: ministros-voice
    runtime: python
    plan: standard   # free tier sleeps + often OOM with torch; use at least 2 GB RAM
    region: singapore
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # Writable Cargo/Rust homes (fixes maturin "Read-only file system" on Render)
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo
      - key: RUSTUP_HOME
        value: /opt/render/project/src/.rustup
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: ENABLE_DEMO_LOGIN
        value: "0"
      - key: CALL_MUTE_TIMEOUT_SECS
        value: "40"
      - key: CALL_MUTE_RESUME_MIN_WORDS
        value: "6"
      - key: AWAITING_TIMEOUT_SECS
        value: "40"
      - key: AWAITING_MISS_RESUME_AFTER
        value: "3"
      - key: LLM_EMPTY_GUARD_TIMEOUT_SECS
        value: "20"
      - key: SESSION_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_ANONYMOUS_WS
        value: "0"
      - key: MAX_CONCURRENT_SESSIONS
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: RNNOISE_ENABLED
        value: "false"
