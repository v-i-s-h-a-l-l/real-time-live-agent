# Render Blueprint — Ministros voice backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ministros-voice
    runtime: python
    plan: standard   # free tier sleeps + often OOM with torch; use at least 2 GB RAM
    region: singapore  # change if you prefer
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: HOST
        value: "0.0.0.0"
